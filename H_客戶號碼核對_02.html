<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職場實務練習 - 英數核對</title>
    <style>
        body { font-family: "PingFang TC", sans-serif; background-color: #fcfcfc; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid #9b59b6; }
        h2 { color: #8e44ad; text-align: center; }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .task-box { border: 3px solid #9b59b6; padding: 20px; border-radius: 15px; margin-bottom: 20px; background-color: #f5eef8; text-align: center; }
        .target-code { font-family: 'Courier New', monospace; font-size: 2.5em; font-weight: bold; color: #2c3e50; letter-spacing: 2px; }
        
        .option-btn { width: 100%; padding: 16px; background-color: #ffffff; color: #333; text-align: center; margin-bottom: 10px; border: 2px solid #e0e0e0; border-radius: 12px; font-family: 'Courier New', monospace; font-size: 1.6em; font-weight: bold; cursor: pointer; }
        .option-btn:active { background-color: #f4ecf7; border-color: #9b59b6; }
        
        #report { white-space: pre-wrap; background: #fafafa; padding: 20px; border: 1px solid #ddd; font-size: 1.2em; line-height: 1.6; border-radius: 10px; }
        .hidden { display: none; }
        .teacher-box { background-color: #e67e22; color: white; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2>英數混合編號核對</h2>
        <p style="text-align:center; color:#7f8c8d;">練習處理職場上的編碼與貨號</p>
        <div class="input-group">
            <label>學生姓名：</label>
            <input type="text" id="studentName" placeholder="輸入您的姓名">
        </div>
        <div class="input-group">
            <label>班別：</label>
            <input type="text" id="studentClass" placeholder="輸入您的班別">
        </div>
        <button onclick="startApp()" style="width:100%; padding:15px; background:#8e44ad; color:white; border:none; border-radius:10px; font-size:1.2em; cursor:pointer;">開始測驗</button>
    </div>

    <div id="task-screen" class="hidden">
        <div style="text-align:center; font-weight:bold; color:#8e44ad; margin-bottom:10px;" id="progress-text">1 / 60</div>
        <div class="task-box">
            <p style="margin:0; font-size:1.1em; color:#555;">請選出完全相同的編號：</p>
            <div id="target-code" class="target-code"></div>
        </div>
        <div id="options-container"></div>
    </div>

    <div id="report-screen" class="hidden">
        <h2 style="color:#27ae60;">測驗完成！</h2>
        <div id="report"></div>
        <div class="teacher-box">
            ⚠️ 請保持此畫面，通知老師記錄成績。
        </div>
        <button onclick="location.reload()" style="width:100%; margin-top:20px; padding:10px; background:#bdc3c7; border:none; border-radius:5px; color:white;">重新開始</button>
    </div>
</div>

<script>
    let currentTask = 0;
    let score = 0;
    const totalTasks = 60;
    let studentInfo = { name: "", class: "" };

    const pool = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 移除了易混淆的 I, O, 0, 1

    function generateCode() {
        let p1 = "";
        let p2 = "";
        for(let i=0; i<4; i++) {
            p1 += pool.charAt(Math.floor(Math.random() * pool.length));
            p2 += pool.charAt(Math.floor(Math.random() * pool.length));
        }
        return `${p1} ${p2}`;
    }

    function generateSimilar(original) {
        let arr = original.split('');
        let indices = [0,1,2,3,5,6,7,8]; // 排除空格索引 4
        let idx = indices[Math.floor(Math.random() * indices.length)];
        
        let oldVal = arr[idx];
        let newVal = pool.charAt(Math.floor(Math.random() * pool.length));
        while(newVal === oldVal) {
            newVal = pool.charAt(Math.floor(Math.random() * pool.length));
        }
        
        arr[idx] = newVal;
        return arr.join('');
    }

    function startApp() {
        studentInfo.name = document.getElementById('studentName').value;
        studentInfo.class = document.getElementById('studentClass').value;
        if (!studentInfo.name || !studentInfo.class) {
            alert("請輸入資料"); return;
        }
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('task-screen').classList.remove('hidden');
        loadTask();
    }

    function loadTask() {
        if (currentTask >= totalTasks) {
            showReport();
            return;
        }

        document.getElementById('progress-text').innerText = `題目進度：${currentTask + 1} / ${totalTasks}`;
        const target = generateCode();
        document.getElementById('target-code').innerText = target;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        let choices = [{ text: target, correct: true }];

        while(choices.length < 5) {
            let fake = generateSimilar(target);
            if(!choices.find(c => c.text === fake)) {
                choices.push({ text: fake, correct: false });
            }
        }

        choices.sort(() => Math.random() - 0.5);

        choices.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = item.text;
            btn.onclick = () => {
                if (item.correct) score++;
                currentTask++;
                loadTask();
            };
            optionsContainer.appendChild(btn);
        });
    }

    function showReport() {
        document.getElementById('task-screen').classList.add('hidden');
        document.getElementById('report-screen').classList.remove('hidden');
        
        const now = new Date().toLocaleString('zh-HK');
        document.getElementById('report').innerText = `
【 職場精確度練習報告 】
---------------------------
學生姓名：${studentInfo.name}
學生班別：${studentInfo.class}
完成日期：${now}
練習類型：英數混合辨識
---------------------------
總題數：${totalTasks}
答對題數：${score}
百分比得分：${Math.round((score/totalTasks)*100)} 分
---------------------------
        `;
    }
</script>

</body>
</html>
