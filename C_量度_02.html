<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職場實務練習 - 尺碼量度 (0.5cm)</title>
    <style>
        body { font-family: "PingFang TC", sans-serif; background-color: #f0f4f8; padding: 15px; text-align: center; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid #3498db; }
        h2 { color: #2980b9; }
        .input-group { margin-bottom: 15px; text-align: left; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 20px; text-align: center; }
        
        /* 尺子視覺設計 */
        .ruler-container { position: relative; width: 100%; height: 150px; background: #fffde7; border: 2px solid #555; border-radius: 5px; margin: 40px 0; overflow: hidden; }
        .ruler-mark { position: absolute; bottom: 0; width: 2px; background: #333; }
        .ruler-mark.half { height: 45px; width: 1.5px; background: #7f8c8d; } /* 0.5cm 的刻度較短 */
        .ruler-mark.full { height: 70px; width: 2.5px; background: #000; }  /* 整數刻度較長且粗 */
        .ruler-label { position: absolute; bottom: 80px; transform: translateX(-50%); font-weight: bold; font-size: 16px; }
        
        .pointer { position: absolute; top: 0; width: 4px; height: 100%; background: #e74c3c; z-index: 10; transition: left 0.3s; }
        .pointer-head { position: absolute; top: -10px; left: -10px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 18px solid #e74c3c; }

        button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 1.2em; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .progress { color: #7f8c8d; font-weight: bold; margin-bottom: 10px; }
        #report { white-space: pre-wrap; text-align: left; background: #f8f9fa; padding: 20px; border: 2px dashed #bdc3c7; font-size: 1.1em; }
        .hidden { display: none; }
        .teacher-box { background-color: #d35400; color: white; padding: 15px; border-radius: 10px; margin-top: 20px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2>尺碼量度練習 (包含 0.5cm)</h2>
        <p>請輸入資料以開始 60 題練習：</p>
        <div class="input-group">
            <label>學生姓名：</label>
            <input type="text" id="studentName" placeholder="姓名">
        </div>
        <div class="input-group">
            <label>班別：</label>
            <input type="text" id="studentClass" placeholder="班別">
        </div>
        <button onclick="startApp()">開始練習</button>
    </div>

    <div id="task-screen" class="hidden">
        <div class="progress" id="progress-text">進度：1 / 60</div>
        <p style="font-size: 1.3em;">請讀取數值，並輸入數字 (如：<b>3.5</b>)：</p>
        
        <div class="ruler-container" id="ruler">
            <div id="pointer" class="pointer"><div class="pointer-head"></div></div>
        </div>

        <input type="number" id="answerInput" step="0.5" placeholder="輸入答案 (例如 7.5)" autofocus>
        <button onclick="checkAnswer()">確認答案並下一題</button>
    </div>

    <div id="report-screen" class="hidden">
        <h2>練習完成</h2>
        <div id="report"></div>
        <div class="teacher-box">
            📢 練習已完成，請舉手請老師來核對分數。
        </div>
        <button onclick="location.reload()" style="background:#7f8c8d;">重新開始</button>
    </div>
</div>

<script>
    let currentTask = 0;
    let score = 0;
    const totalTasks = 60;
    let correctAnswer = 0;
    let studentInfo = { name: "", class: "" };

    function initRuler() {
        const ruler = document.getElementById('ruler');
        // 顯示 0 到 15 cm
        for (let i = 0; i <= 15; i++) {
            const leftPos = (i * (100 / 15)); 
            
            // 整數長刻度
            const mark = document.createElement('div');
            mark.className = 'ruler-mark full';
            mark.style.left = leftPos + '%';
            ruler.appendChild(mark);

            // 數字標籤
            const label = document.createElement('div');
            label.className = 'ruler-label';
            label.style.left = leftPos + '%';
            label.innerText = i;
            ruler.appendChild(label);

            // 半公分刻度 (不畫在最後一個數字之後)
            if (i < 15) {
                const halfPos = leftPos + (50 / 15);
                const halfMark = document.createElement('div');
                halfMark.className = 'ruler-mark half';
                halfMark.style.left = halfPos + '%';
                ruler.appendChild(halfMark);
            }
        }
    }

    function startApp() {
        studentInfo.name = document.getElementById('studentName').value;
        studentInfo.class = document.getElementById('studentClass').value;
        if (!studentInfo.name || !studentInfo.class) {
            alert("請完整輸入資料"); return;
        }
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('task-screen').classList.remove('hidden');
        initRuler();
        loadTask();
    }

    function loadTask() {
        if (currentTask >= totalTasks) {
            showReport();
            return;
        }

        document.getElementById('progress-text').innerText = `題目：${currentTask + 1} / ${totalTasks}`;
        document.getElementById('answerInput').value = '';
        document.getElementById('answerInput').focus();

        // 隨機生成 0 到 15 之間，以 0.5 為單位的數值
        // 生成 0 到 30 的隨機整數，再除以 2
        correctAnswer = Math.floor(Math.random() * 31) / 2;
        
        // 移動指標位置
        const pointer = document.getElementById('pointer');
        pointer.style.left = (correctAnswer * (100 / 15)) + '%';
    }

    function checkAnswer() {
        const studentInput = document.getElementById('answerInput').value;
        if (studentInput === "") {
            alert("請輸入答案"); return;
        }

        const studentAnswer = parseFloat(studentInput);
        if (studentAnswer === correctAnswer) {
            score++;
        }

        currentTask++;
        loadTask();
    }

    function showReport() {
        document.getElementById('task-screen').classList.add('hidden');
        document.getElementById('report-screen').classList.remove('hidden');
        
        const now = new Date().toLocaleString('zh-HK');
        document.getElementById('report').innerText = `
【 尺碼量度練習成績單 (0.5cm) 】
---------------------------------
完成時間：${now}
學生姓名：${studentInfo.name}
班別：${studentInfo.class}
---------------------------------
總題數：${totalTasks}
答對題數：${score}
得分：${Math.round((score/totalTasks)*100)} 分
---------------------------------
狀態：測驗完畢
        `;
    }

    // 支援 Enter 鍵
    document.getElementById('answerInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });
</script>

</body>
</html>
