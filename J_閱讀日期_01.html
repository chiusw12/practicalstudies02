<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職場實務練習 - 有效日期檢查</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .option-btn { background-color: #ecf0f1; color: #333; text-align: left; margin-bottom: 8px; border: 1px solid #bdc3c7; }
        .option-btn:hover { background-color: #dfe6e9; }
        .progress { font-size: 0.9em; color: #7f8c8d; margin-bottom: 10px; }
        .task-box { border: 2px solid #3498db; padding: 15px; border-radius: 10px; margin-bottom: 20px; background-color: #ebf5fb; }
        #report { white-space: pre-wrap; background: #f9f9f9; padding: 20px; border: 1px dashed #7f8c8d; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2>職場實務練習</h2>
        <p>請輸入個人資料以開始練習：</p>
        <div class="input-group">
            <label>學生姓名：</label>
            <input type="text" id="studentName" placeholder="例如：陳大文">
        </div>
        <div class="input-group">
            <label>班別：</label>
            <input type="text" id="studentClass" placeholder="例如：1A">
        </div>
        <button onclick="startApp()">開始練習</button>
    </div>

    <div id="task-screen" class="hidden">
        <div class="progress" id="progress-text">題目：1 / 60</div>
        <div class="task-box">
            <p><strong>規則：</strong> 請從下方五個日期中，選出一個<strong>早於</strong> (已過期) 下列基準日期的選項：</p>
            <h3 id="target-date-display" style="color: #e74c3c; text-align: center;"></h3>
        </div>
        <div id="options-container">
            </div>
    </div>

    <div id="report-screen" class="hidden">
        <h2>練習完成報告</h2>
        <div id="report"></div>
        <p style="color: #e67e22; font-weight: bold; text-align: center; font-size: 1.2em;">
            ⚠️ 請舉手並通知老師前來記錄成績。
        </p>
        <button onclick="location.reload()">重新開始</button>
    </div>
</div>

<script>
    let currentTask = 0;
    let score = 0;
    const totalTasks = 60;
    let studentInfo = { name: "", class: "" };

    // Function to generate random date string (YYYY-MM-DD)
    function getRandomDate(start, end) {
        let date = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
        return date.toISOString().split('T')[0];
    }

    function startApp() {
        studentInfo.name = document.getElementById('studentName').value;
        studentInfo.class = document.getElementById('studentClass').value;

        if (!studentInfo.name || !studentInfo.class) {
            alert("請填寫姓名及班別！");
            return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('task-screen').classList.remove('hidden');
        loadTask();
    }

    function loadTask() {
        if (currentTask >= totalTasks) {
            showReport();
            return;
        }

        document.getElementById('progress-text').innerText = `題目：${currentTask + 1} / ${totalTasks}`;
        
        // Base target date (mid-2024)
        const targetDateStr = getRandomDate(new Date(2024, 5, 1), new Date(2024, 6, 30));
        const targetDate = new Date(targetDateStr);
        document.getElementById('target-date-display').innerText = `基準日期：${targetDateStr}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        // Generate 1 expired date (before target) and 4 valid dates (after target)
        let dates = [];
        // Expired (Correct Answer)
        dates.push({ date: getRandomDate(new Date(2023, 0, 1), new Date(targetDate.getTime() - 86400000)), correct: true });
        // Valid (Wrong Answers)
        for(let i=0; i<4; i++) {
            dates.push({ date: getRandomDate(new Date(targetDate.getTime() + 86400000), new Date(2026, 0, 1)), correct: false });
        }

        // Shuffle options
        dates.sort(() => Math.random() - 0.5);

        dates.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = item.date;
            btn.onclick = () => checkAnswer(item.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) score++;
        currentTask++;
        loadTask();
    }

    function showReport() {
        document.getElementById('task-screen').classList.add('hidden');
        document.getElementById('report-screen').classList.remove('hidden');
        
        const now = new Date().toLocaleString('zh-HK');
        const reportText = `
【學生練習報告】
---------------------------
完成時間：${now}
學生姓名：${studentInfo.name}
班別：${studentInfo.class}
練習項目：有效日期辨識 (60題)
總分：${totalTasks}
得分：${score}
正確率：${((score/totalTasks)*100).toFixed(1)}%
---------------------------
狀態：已完成
        `;
        document.getElementById('report').innerText = reportText;
    }
</script>

</body>
</html>
